name: Lint Check

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  eslint:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: 'true'

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - run: pnpm install --frozen-lockfile

      - run: pnpm compile && pnpm lint
