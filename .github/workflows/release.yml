env:
  DIRECTORY: dist
  PROJECT_NAME: 琉璃小工具
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  KEEP_RELEASES: '10'

name: Release
on:
  workflow_dispatch:
    inputs:
      keep:
        description: 'Number of releases to keep when pruning (overrides env.KEEP_RELEASES)'
        required: false
        type: number
permissions:
  contents: write
jobs:

  build:
    name: Build
    outputs:
      created: ${{ env.DAILY_VERSION_CREATED }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Create tag if necessary
        uses: fregante/daily-version-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update manifest.json with version ${{ env.DAILY_VERSION }}
        if: env.DAILY_VERSION_CREATED
        run: npx dot-json@1 "$DIRECTORY/manifest.json" version "$DAILY_VERSION"
      - name: Ready for "submit" jobs
        if: env.DAILY_VERSION_CREATED
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ env.DIRECTORY }}
      - name: Create release
        if: env.DAILY_VERSION_CREATED
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILENAME_ZIP="$PROJECT_NAME-$DAILY_VERSION.zip"
          FILENAME_CRX="$PROJECT_NAME-$DAILY_VERSION.crx"
          cd "$DIRECTORY" && zip -r "$FILENAME_ZIP" ./* && npx crx pack . -o "$FILENAME_CRX" && gh release create "$DAILY_VERSION" "$FILENAME_ZIP" "$FILENAME_CRX" --generate-notes

  prune:
    if: needs.build.outputs.created || github.event_name == 'workflow_dispatch'
    needs: build
    name: Prune old releases
    runs-on: ubuntu-latest
    steps:
      - name: Delete old releases (keep latest $KEEP_RELEASES)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ inputs.keep || env.KEEP_RELEASES }}
        run: |
          set -e
          KEEP="${KEEP:-10}"
          echo "Keeping the latest ${KEEP} releases."
          TAGS=$(gh release list --limit 200 --json tagName --jq '.[].tagName')
          COUNT=$(echo "$TAGS" | wc -l | tr -d ' ')
          echo "Total releases: ${COUNT}"
          if [ "$COUNT" -le "$KEEP" ]; then
            echo "Nothing to prune."
            exit 0
          fi
          TO_DELETE=$(echo "$TAGS" | tail -n +$((KEEP + 1)))
          for TAG in $TO_DELETE; do
            echo "Deleting release: ${TAG}"
            gh release delete "$TAG" --yes --cleanup-tag || echo "Failed to delete ${TAG}"
          done

  chrome:
    if: needs.build.outputs.created
    needs: build
    name: Submit (Chrome)
    environment: Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx chrome-webstore-upload-cli@3
        working-directory: dist
        env:
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}

